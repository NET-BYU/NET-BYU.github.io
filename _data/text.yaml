# The words on the site's pages: headings, intros, button labels and the longer paragraphs.
#
# How to edit:
#   - Change the text after the colon; leave the name before the colon alone.
#   - Keep text in "double quotes" when it is in quotes already (needed when it contains a colon
#     or starts with a special character). Inside quotes, write \" for a quotation mark.
#   - Text under a "|" is one or more paragraphs. Keep it indented; a blank line starts a new
#     paragraph, and line breaks inside a paragraph don't matter.
#     Paragraphs accept Markdown: **bold**, *italic* and [link text](https://example.com).
#   - Headings marked "gray" are the second half of a two-tone heading, shown in gray right after
#     the black part. Use "" to have none.
#
# Lists live in their own files: papers, projects (and their news links), people, articles and the
# Mission principles are in this folder (_data/). The site's one-paragraph description and the
# footer's contact details are in _config.yml. The README has the full map.

