---
layout: default
title: Page not found
permalink: /404.html
sitemap: false
---
<section class="wrap lost" aria-labelledby="lost-title">
  <div>
    {%- assign t = site.data.text.not_found %}
    <h1 class="page-title" id="lost-title">{{ t.headline }}{% if t.headline_gray != "" %} <span class="tone">{{ t.headline_gray }}</span>{% endif %}</h1>
    <p class="lede" style="margin-top: 20px">{{ t.intro }}</p>
    <div class="actions">
      <a class="btn" href="/">Home</a>
      <a class="btn" href="/papers/">Papers</a>
      <a class="btn" href="/projects/">Projects</a>
      <a class="btn" href="/people/">People</a>
    </div>
  </div>
  <figure class="fig" data-area="subprotocols" data-anim="packet-lost">
    <div class="fig-stage" data-label="A packet leaves a router, misses its hop, and falls off the route.">
    </div>
  </figure>
</section>
